individuals:
- Resident
- Intruder
uniquebodyparts:
- implantFront
- implantLeft
- implantRight
- implantBack
multianimalbodyparts:
- nose
- rightEar
- leftEar
- neckBase
- betNeckBaseAndMidPoint
- midPoint
- betMidPointAndTailBase
- tailBase
- tailMid
- tailTip
bodyparts: MULTI!


# Fraction of video to start/stop when extracting frames for labeling/refinement
start: 0
stop: 1
numframes2pick: 10


# Plotting configuration
skeleton:
- - nose
  - leftEar
- - nose
  - rightEar
- - nose
  - implantFront
- - implantFront
  - implantLeft
- - implantFront
  - implantRight
- - implantBack
  - implantRight
- - leftEar
  - implantLeft
- - rightEar
  - implantRight
- - implantLeft
  - implantRight
- - implantLeft
  - implantBack
- - implantRight
  - implantBack
- - leftEar
  - neckBase
- - rightEar
  - neckBase
- - leftEar
  - betNeckBaseAndMidPoint
- - rightEar
  - betNeckBaseAndMidPoint
- - neckBase
  - betNeckBaseAndMidPoint
- - betNeckBaseAndMidPoint
  - midPoint
- - midPoint
  - betMidPointAndTailBase
- - betMidPointAndTailBase
  - tailBase
- - tailBase
  - tailMid
- - tailMid
  - tailTip


skeleton_color: red
pcutoff: 0.8
dotsize: 3
alphavalue: 0.7
colormap: rainbow


# Training,Evaluation and Analysis configuration
TrainingFraction:
- 0.99
iteration: 4
default_net_type: resnet_101
default_augmenter: albumentations
default_track_method: skeleton
snapshotindex: -1
detector_snapshotindex: -1
batch_size: 8


# Cropping Parameters (for analysis and outlier frame detection)
cropping: false
#if cropping is true for analysis, then set the values here:
x1: 0
x2: 640
y1: 277
y2: 624


# Refinement configuration (parameters from annotation dataset configuration also relevant in this stage)
corner2move2:
- 50
- 50
move2corner: true


# Conversion tables to fine-tune SuperAnimal weights
SuperAnimalConversionTables:
detector_batch_size: 1
